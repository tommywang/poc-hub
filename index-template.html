<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POC Hub</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Satoshi', sans-serif; background: #f7f6f2; color: #28251d;
           min-height: 100vh; display: flex; align-items: center; justify-content: center;
           flex-direction: column; gap: 1rem; padding: 2rem; text-align: center; }
    h1 { font-size: 2.5rem; font-weight: 700; }
    h1 span { color: #01696f; }
    p { color: #7a7974; max-width: 40ch; line-height: 1.6; }
    code { background: #f3f0ec; padding: 3px 8px; border-radius: 6px;
           font-size: 0.9rem; color: #01696f; }
  </style>
</head>
<body>
  <h1>POC <span>Hub</span></h1>
  <p>向 Telegram Bot 发送指令，自动生成 Angular POC 并部署到这里</p>
  <p>示例：<code>/poc create jwt-auth "JWT 认证流程 POC"</code></p>
</body>
</html>
