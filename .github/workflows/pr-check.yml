name: 🧪 PR Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'

jobs:
  detect-changes:
    name: 🔍 Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: detect
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^apps/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$CHANGED" >> $GITHUB_OUTPUT
          COUNT=$(echo "$CHANGED" | jq 'length')
          [ "$COUNT" -gt "0" ] && echo "has_changes=true" >> $GITHUB_OUTPUT || echo "has_changes=false" >> $GITHUB_OUTPUT

  build-check:
    name: 🔨 Build check ${{ matrix.app }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: apps/${{ matrix.app }}

      - name: Build (dev mode for speed)
        working-directory: apps/${{ matrix.app }}
        run: |
          npx ng build \
            --configuration development \
            --base-href /${{ github.event.repository.name }}/${{ matrix.app }}/

      - name: Comment PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const app = '${{ matrix.app }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const previewUrl = `https://${owner}.github.io/${repo}/${app}/`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: owner,
              repo: repo,
              body: `### ✅ Build check passed for \`${app}\`\n\n` +
                    `After merge, preview will be available at:\n` +
                    `🌐 **${previewUrl}**\n\n` +
                    `*Build completed at ${new Date().toISOString()}*`
            });
